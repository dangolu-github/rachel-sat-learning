<!doctype html><html lang="en"><head><meta charset="utf-8"><script src="../../../assets/access.js?v=20260926"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Structure and Purpose · Section 1 · Annotated</title><style>body{margin:0;background:#f4f6f5;font:15px system-ui;color:#27463d}.tools{position:sticky;top:0;z-index:5;padding:10px 14px;background:#fff;border-bottom:1px solid #d5dfd9;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,a{font:inherit;padding:6px 10px;color:#285847}#scroll{overflow:auto}#stage{position:relative}iframe{border:0;width:1682px;transform-origin:0 0;display:block;background:white}</style></head><body><div class="tools"><b>Text Structure and Purpose · Section 1 · Annotated</b><button id="fit">Fit page</button><button id="actual">100%</button><button onclick="document.getElementById('sheet').contentWindow.print()">Save as PDF</button></div><div id="scroll"><div id="stage"><iframe id="sheet" title="Text Structure and Purpose · Section 1 · Annotated" src="annotated.html"></iframe></div></div><script>const W=1682;const frame=document.getElementById('sheet'),stage=document.getElementById('stage');let h=3000,fit=true;function size(){const scale=fit?Math.min(1,document.documentElement.clientWidth/W):1;frame.style.height=h+'px';frame.style.transform='scale('+scale+')';stage.style.width=(W*scale)+'px';stage.style.height=(h*scale)+'px'}addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data?.type!=='annotation-size')return;h=e.data.height;size()});document.getElementById('fit').onclick=()=>{fit=true;size()};document.getElementById('actual').onclick=()=>{fit=false;size()};addEventListener('resize',size);size();</script></body></html>
